name: Deploy DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: [self-hosted, samsecure]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync app source to server
        run: |
          umask 022
          mkdir -p /var/www/samsecure
          rsync -rt --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "staging-dist" \
            --exclude "dev-dist" \
            --exclude "vite.config.js." \
            --include "server/.env*.example" \
            --exclude "server/.env*" \
            ./ /var/www/samsecure/

      - name: Install dependencies
        working-directory: /var/www/samsecure
        run: npm ci

      - name: Restart PM2
        working-directory: /var/www/samsecure
        run: |
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
