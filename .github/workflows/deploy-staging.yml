name: Deploy STAGING

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: [self-hosted, samsecure]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync app source to server
        run: |
          umask 022
          mkdir -p /var/www/samsecure
          mkdir -p /var/www/samsecure/staging-dist
          rsync -rt --omit-dir-times --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "dev-dist" \
            --exclude "vite.config.js." \
            --include "server/.env*.example" \
            --exclude "server/.env*" \
            ./ /var/www/samsecure/

      - name: Install dependencies
        working-directory: /var/www/samsecure
        run: npm ci

      - name: Build staging
        working-directory: /var/www/samsecure
        run: npm run build:staging

      - name: Reload staging API
        working-directory: /var/www/samsecure
        run: |
          pm2 reload samsecure-api-staging --update-env
          pm2 save

      - name: Fix permissions for NGINX
        run: |
          chmod o+x /var/www/samsecure
          chmod -R o+rX /var/www/samsecure/staging-dist
